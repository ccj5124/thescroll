<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A social feed built on purpose to be addictive, that turns on you after ninety seconds and names every trick it just used. A PYP Exhibition experiment about phone addiction.">
<meta name="theme-color" content="#0B0710">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta property="og:title" content="The Scroll">
<meta property="og:description" content="Ninety seconds of the best stuff on the internet. Then it tells you what it did to you.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B1%3C/text%3E%3C/svg%3E">
<title>The Scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;700;900&display=swap">

</head>
<body>
<style>
/* ============================================================
   THE SCROLL - a deliberately addictive feed that turns on you.
   One committed visual world: candy-dark app, then bone report.
   Every colour is painted explicitly so it holds on any ground.
   ============================================================ */
:root{
  /* feed world */
  --void:#0B0710;
  --shell:#140C1E;
  --surface:#1E1329;
  --line:#3A2650;
  --ink:#F6EEFA;
  --ink-dim:#A38FB5;
  --hot:#FF2D78;
  --cyan:#22E0D6;
  --gold:#FFC53D;
  /* report world */
  --bone:#F2F0EB;
  --bone-2:#E4E1D8;
  --graphite:#14110E;
  --graphite-dim:#6B655C;
  --alarm:#C42B1C;
  --rule:#C9C4B8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--void);
  color:var(--ink);
  font-family:"Archivo","Noto Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
:lang(zh){font-family:"Noto Sans SC","Archivo",system-ui,sans-serif;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;}

.aura{
  position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(46vmax 46vmax at 28% 18%, rgba(255,45,120,.20), transparent 62%),
    radial-gradient(40vmax 40vmax at 76% 84%, rgba(34,224,214,.14), transparent 64%);
  transition:opacity .9s ease;
}

/* ---------- the phone ---------- */
.phone{
  position:relative;z-index:2;
  width:min(430px,100vw);
  height:min(880px,100vh);
  height:min(880px,100dvh);
  background:var(--shell);
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 40px 120px -20px rgba(0,0,0,.9), 0 0 0 1px var(--line);
}
@media (min-width:520px) and (min-height:760px){
  .phone{border-radius:34px;height:min(840px,94vh);height:min(840px,94dvh);}
}

.status{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 8px;
  font:600 12px/1 "IBM Plex Mono",monospace;
  color:var(--ink-dim);letter-spacing:.06em;
}
.status .brand{
  font-family:"Archivo Black","Noto Sans SC",sans-serif;
  font-size:15px;letter-spacing:-.02em;color:var(--ink);
}
.status .brand em{font-style:normal;color:var(--hot);}
.lang{
  font:600 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;
  color:var(--ink-dim);border:1px solid var(--line);
  padding:5px 8px;border-radius:999px;
}
.lang:hover{color:var(--ink);border-color:var(--hot);}

/* ---------- start ---------- */
.start{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;padding:32px;text-align:center;
}
.start .mark{
  font-family:"Archivo Black",sans-serif;
  font-size:clamp(52px,15vw,78px);line-height:.86;letter-spacing:-.045em;
  color:var(--ink);text-wrap:balance;
}
.start .mark em{font-style:normal;color:var(--hot);}
.start p{color:var(--ink-dim);font-size:15px;max-width:26ch;line-height:1.55;}
.open{
  background:var(--hot);color:#fff;font-weight:700;font-size:17px;
  padding:16px 46px;border-radius:999px;
  box-shadow:0 12px 34px -8px rgba(255,45,120,.7);
  transition:transform .15s ease, box-shadow .15s ease;
}
.open:hover{transform:translateY(-2px);box-shadow:0 18px 42px -8px rgba(255,45,120,.85);}
.open:active{transform:translateY(1px) scale(.98);}
.fineprint{font:400 11px/1.5 "IBM Plex Mono",monospace;color:#6E5C7E;}

/* ---------- feed ---------- */
.feed{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  scrollbar-width:none;
  display:flex;flex-direction:column;gap:10px;
  padding:4px 12px 18px;
}
.feed::-webkit-scrollbar{display:none;}

.pull{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  height:52px;border-radius:16px;
  background:linear-gradient(180deg,var(--surface),transparent);
  color:var(--ink-dim);font:600 12px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;
  border:1px dashed var(--line);
}
.pull:hover{color:var(--cyan);border-color:var(--cyan);}
.pull.spin{color:var(--gold);border-color:var(--gold);}

.card{
  flex:0 0 auto;border-radius:20px;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  animation:rise .42s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.99);}to{opacity:1;transform:none;}}
.card .head{display:flex;align-items:center;gap:9px;padding:11px 14px;}
.avatar{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:15px;}
.who{font-weight:700;font-size:13.5px;letter-spacing:-.01em;}
.ago{font:400 11px/1 "IBM Plex Mono",monospace;color:var(--ink-dim);margin-left:auto;}
.media{height:212px;display:grid;place-items:center;font-size:76px;position:relative;}
.media .sticker{
  position:absolute;bottom:10px;left:12px;
  font:600 10px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;
  background:rgba(11,7,16,.62);color:#fff;padding:6px 9px;border-radius:6px;
  backdrop-filter:blur(6px);
}
.cap{padding:11px 14px 4px;font-size:14px;line-height:1.45;}
.bar{display:flex;align-items:center;gap:16px;padding:9px 14px 13px;color:var(--ink-dim);}
.act{display:flex;align-items:center;gap:6px;font:600 12.5px/1 "IBM Plex Mono",monospace;}
.act .glyph{font-size:17px;line-height:1;transition:transform .18s cubic-bezier(.2,1.6,.4,1);}
.act:hover{color:var(--ink);}
.act.on{color:var(--hot);}
.act.on .glyph{transform:scale(1.35);}
.act.pop .glyph{animation:pop .42s cubic-bezier(.2,1.7,.3,1);}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.7) rotate(-9deg);}100%{transform:scale(1.35);}}

.card.jackpot{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 16px 50px -14px rgba(255,197,61,.55);}
.card.jackpot .media{
  background:linear-gradient(140deg,#4A2E00,#8A5A00 45%,#FFC53D);
  animation:shimmer 2.6s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{filter:brightness(1);}50%{filter:brightness(1.22);}}
.jack-tag{font-family:"Archivo Black",sans-serif;font-size:12px;letter-spacing:.14em;color:var(--gold);padding:0 14px 2px;}

/* the near miss: dressed up enough to raise your hopes, then nothing */
.card.miss{border-color:#6B5320;}
.card.miss .media::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(140deg,rgba(255,197,61,.22),transparent 58%);
}
.card.miss .media{opacity:.9;}
.card.miss .sticker{color:var(--gold);}

.streak{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:13px;border-radius:16px;
  background:linear-gradient(90deg,rgba(255,45,120,.16),rgba(34,224,214,.14));
  border:1px solid var(--line);
  font-family:"Archivo Black",sans-serif;font-size:13px;letter-spacing:.04em;
  animation:rise .42s cubic-bezier(.2,.8,.2,1) both;
}
.streak b{color:var(--gold);font-family:"IBM Plex Mono",monospace;font-size:17px;}

/* ---------- toasts ---------- */
.toasts{
  position:absolute;top:46px;left:12px;right:12px;z-index:20;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:10px;
  background:rgba(30,19,41,.93);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:14px;padding:11px 13px;
  box-shadow:0 14px 40px -12px rgba(0,0,0,.85);
  animation:slidein .38s cubic-bezier(.2,.9,.2,1) both;
}
@keyframes slidein{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:none;}}
.toast.out{animation:slideout .34s ease forwards;}
@keyframes slideout{to{opacity:0;transform:translateY(-12px);}}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--hot);flex:0 0 auto;box-shadow:0 0 0 4px rgba(255,45,120,.2);}
.toast .txt{font-size:13px;line-height:1.35;}
.toast .txt small{display:block;color:var(--ink-dim);font-size:11.5px;margin-top:1px;}

/* ---------- nav ---------- */
.nav{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;
  padding:12px 8px 16px;border-top:1px solid var(--line);background:var(--shell);
}
.tab{position:relative;display:grid;place-items:center;gap:4px;width:60px;
  font:600 9.5px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;color:#6E5C7E;}
.tab .ic{font-size:19px;}
.tab.sel{color:var(--ink);}
.badge{
  position:absolute;top:-5px;right:8px;min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--hot);color:#fff;
  font:700 10.5px/18px "IBM Plex Mono",monospace;text-align:center;
  box-shadow:0 0 0 2px var(--shell);
}
.badge.bump{animation:bump .4s cubic-bezier(.2,1.7,.3,1);}
@keyframes bump{0%{transform:scale(1);}45%{transform:scale(1.5);}100%{transform:scale(1);}}

/* ---------- the cut ---------- */
.flash{position:fixed;inset:0;z-index:60;background:#fff;opacity:0;pointer-events:none;}
.flash.go{animation:cut 1.05s ease forwards;}
@keyframes cut{
  0%{opacity:0;background:#fff;} 6%{opacity:1;} 10%{opacity:.1;} 14%{opacity:1;}
  30%{opacity:1;background:#fff;} 55%{background:#000;opacity:1;} 100%{background:#000;opacity:1;}
}

/* ---------- report ---------- */
.report{
  position:fixed;inset:0;z-index:70;overflow-y:auto;
  background:var(--bone);color:var(--graphite);display:none;
}
.report.show{display:block;}
.sheet{max-width:660px;margin:0 auto;padding:clamp(28px,6vw,64px) clamp(20px,5vw,40px) 96px;}
.eyebrow{font:600 11px/1 "IBM Plex Mono",monospace;letter-spacing:.24em;color:var(--graphite-dim);text-transform:uppercase;}
.hr{height:1px;background:var(--rule);}
.verdict{
  font-family:"Archivo Black","Noto Sans SC",sans-serif;
  font-size:clamp(31px,7.6vw,50px);line-height:1.02;letter-spacing:-.035em;
  text-wrap:balance;margin-top:14px;
}
.verdict u{text-decoration:none;color:var(--alarm);}
.lede{margin-top:18px;font-size:16.5px;line-height:1.62;max-width:60ch;color:#3A342C;}

.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:30px;
}
.tile{background:var(--bone);padding:16px 16px 14px;}
.tile .k{font:500 10.5px/1.3 "IBM Plex Mono",monospace;letter-spacing:.13em;color:var(--graphite-dim);text-transform:uppercase;}
.tile .v{
  font-family:"IBM Plex Mono",monospace;font-weight:600;
  font-size:clamp(26px,6.4vw,34px);line-height:1.05;margin-top:9px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.tile .u{font-size:14px;font-weight:400;color:var(--graphite-dim);margin-left:4px;}
.tile.zero{background:var(--graphite);}
.tile.zero .k{color:#A39C90;}
.tile.zero .v{color:#fff;}

.h2{
  font-family:"Archivo Black","Noto Sans SC",sans-serif;
  font-size:clamp(21px,4.6vw,27px);letter-spacing:-.025em;line-height:1.14;text-wrap:balance;
}
.tricks{display:flex;flex-direction:column;margin-top:22px;}
.trick{
  display:grid;grid-template-columns:auto 1fr;gap:16px;
  padding:19px 0;border-top:1px solid var(--rule);
  opacity:0;transform:translateY(12px);
}
.trick.in{animation:fadeup .5s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes fadeup{to{opacity:1;transform:none;}}
.trick .count{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;
  font-variant-numeric:tabular-nums;color:var(--alarm);
  white-space:nowrap;padding-top:2px;min-width:4.6ch;
}
.trick h3{font-size:16.5px;font-weight:700;letter-spacing:-.01em;}
.trick .lab{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--graphite-dim);text-transform:uppercase;margin-bottom:5px;}
.trick p{margin-top:7px;font-size:14.5px;line-height:1.6;color:#4A443C;max-width:56ch;}

.kicker{margin-top:40px;padding:26px 24px;background:var(--graphite);color:#F3F1EC;}
.kicker p{font-size:16px;line-height:1.6;max-width:52ch;}
.kicker p+p{margin-top:12px;color:#B8B1A6;font-size:14.5px;}
.kicker strong{color:var(--gold);font-weight:700;}

.ask{margin-top:34px;}
.ask ul{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:10px;}
.ask li{
  display:flex;gap:11px;align-items:baseline;font-size:15.5px;line-height:1.55;
  padding-bottom:10px;border-bottom:1px solid var(--rule);
}
.ask li span{color:var(--alarm);font-family:"IBM Plex Mono",monospace;font-weight:600;}

.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:38px;}
.again{
  background:var(--graphite);color:var(--bone);font-weight:700;font-size:15px;
  padding:15px 30px;border-radius:999px;transition:transform .15s ease,background .15s ease;
}
.again:hover{transform:translateY(-2px);background:var(--alarm);}
.again.ghost{background:none;color:var(--graphite);border:1px solid var(--rule);}
.again.ghost:hover{background:var(--bone-2);color:var(--graphite);}
.sig{margin-top:44px;font:400 11.5px/1.6 "IBM Plex Mono",monospace;color:var(--graphite-dim);letter-spacing:.03em;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}
</style>

<div class="aura" id="aura"></div>

<div class="phone" id="phone">
  <div class="status">
    <div class="brand">LO<em>O</em>P</div>
    <button class="lang" id="lang" type="button">EN / 中</button>
  </div>

  <div class="start" id="start">
    <div class="mark" id="s-mark">See<br>something<br><em>good.</em></div>
    <p id="s-sub">Ninety seconds of the best stuff on the internet. Just start scrolling.</p>
    <button class="open" id="open" type="button">Open Loop</button>
    <div class="fineprint" id="s-fine">v4.2.1 · no account needed</div>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="feed" id="feed" hidden></div>

  <div class="nav" id="nav" hidden>
    <div class="tab sel"><span class="ic">◉</span><span id="t-home">HOME</span></div>
    <div class="tab"><span class="ic">◎</span><span id="t-find">FIND</span></div>
    <div class="tab"><span class="ic">✦</span><span id="t-new">POST</span></div>
    <div class="tab"><span class="ic">☰</span><span id="t-inbox">INBOX</span><span class="badge" id="badge">1</span></div>
  </div>
</div>

<div class="flash" id="flash"></div>

<div class="report" id="report">
  <div class="sheet">
    <div class="eyebrow" id="r-eyebrow">Session report</div>
    <div class="verdict" id="r-verdict"></div>
    <p class="lede" id="r-lede"></p>
    <div class="grid" id="r-grid"></div>

    <div class="hr" style="margin:44px 0 26px"></div>
    <h2 class="h2" id="r-h2"></h2>
    <p class="lede" id="r-h2sub" style="margin-top:12px;font-size:15.5px"></p>
    <div class="tricks" id="r-tricks"></div>

    <div class="kicker" id="r-kicker"></div>

    <div class="ask">
      <h2 class="h2" id="r-askh"></h2>
      <ul id="r-asklist"></ul>
    </div>

    <div class="foot">
      <button class="again" id="again" type="button"></button>
      <button class="again ghost" id="again2" type="button"></button>
    </div>
    <div class="sig" id="r-sig"></div>
  </div>
</div>

<script>
"use strict";
/* ===================== 1. COPY ===================== */
const T = {
  en:{
    mark:'See<br>something<br><em>good.</em>',
    sub:'Ninety seconds of the best stuff on the internet. Just start scrolling.',
    open:'Open Loop', fine:'v4.2.1 · no account needed',
    tabs:['HOME','FIND','POST','INBOX'],
    pull:'↓  PULL TO REFRESH', pulling:'◌  FINDING NEW POSTS…',
    like:'Like', liked:'Liked', share:'Share', save:'Save',
    jack:'★ RARE DROP — 1 IN 40',
    streak:['SCROLL STREAK','in a row. Keep going!'],
    eyebrow:'Session report',
    verdict:'You scrolled <u>{d}</u> and nothing in there was yours to keep.',
    lede:'This app was built for one thing: to make you not stop. It worked. Here is exactly what it took from you, measured while you played.',
    tiles:[['Time inside','SEC'],['Scrolls','SWIPES'],['Finger travelled','M'],['Likes given','TAPS'],['Refreshes','PULLS'],['Real things gained','']],
    h2:'Five tricks this app used on you',
    h2sub:'None of these are accidents. Every one is a design decision that somebody got paid to make. The number on the left is what it did to you, personally, in ninety seconds.',
    tricks:[
      ['INFINITE SCROLL','There was never a bottom',
       'The feed loaded more the moment you got close to the end. A book has a last page, a show has credits, a game has a boss. This had nothing. With no finish line, the only thing that can stop you is you.'],
      ['VARIABLE REWARDS','Most posts were boring on purpose',
       'The rare gold ones turned up at random. Slot machines work the same way: if the good thing came every fifth post you would get bored, but because you cannot predict it, you keep pulling.'],
      ['NEAR MISSES','“Almost” kept you going',
       'Some cards were dressed up like a rare drop and then were not. A near miss feels closer to winning than a plain loss, so it pushes you to try again, even though it is exactly as much of a nothing.'],

       'Nobody actually messaged you. The badge grew because a growing badge makes a thumb move. Your brain treats an unread count as an unfinished job, and unfinished jobs itch.']
    ],
    kick:['Here is the important part: <strong>you are not weak.</strong> You just spent ninety seconds losing to a machine that was designed, tested and tuned by adults whose whole job was to beat you.',

    askh:'So change the setup',
    asks:['Notifications off. Not “later”, off. It is one setting and it deletes the red number.',
          'Phone charges outside the bedroom. The scroll wins at 11pm because the phone is within reach.',
          'Pick the app before you unlock, not after. “I am opening it to do X.” Then close it.',
          'Give it a bottom. A timer, one episode, one video. Anything with an ending that is not you.',
          'Write your house rules down with somebody else. A rule nobody knows about is a wish.'],
    again:'Play again', again2:'Read the tricks again',
    sig:'THE SCROLL · an exhibition experiment about phone addiction\nBuilt by Ella · PYP Exhibition',
    toasts:[['xiaoyu started following you','2 mutual friends'],
            ['3 new messages','tap to open'],
            ['Your post is doing well!','+18 likes in 5 minutes'],
            ['Somebody mentioned you','in a comment'],
            ['You have 1 new notification','from Loop'],
            ['Trending near you','see what everyone is watching'],
            ['You are on a 3 day streak','do not lose it']]
  },
  zh:{
    mark:'看点<br>好东西<br><em>吧。</em>',
    sub:'九十秒全网最好看的内容。直接开始划就行。',
    open:'打开 Loop', fine:'v4.2.1 · 无需登录',
    tabs:['首页','发现','发帖','消息'],
    pull:'↓  下拉刷新', pulling:'◌  正在找新内容…',
    like:'赞', liked:'已赞', share:'转发', save:'收藏',
    jack:'★ 稀有掉落 — 四十分之一',
    streak:['连续划动','条了，别停！'],
    eyebrow:'使用报告',
    verdict:'你刚刚划了 <u>{d}</u>，里面没有一样东西是你的。',

const JACK = [['👑','LEGENDARY CAT','传说猫'],['🌈','1 IN 40 DROP','四十分之一掉落'],
              ['💫','GOLDEN POST','金色帖'],['🏆','TOP 0.1% FEED','前 0.1% 内容']];

/* ===================== 2. STATE ===================== */
const DURATION = 90;          // seconds before the cut
const PX_PER_M = 3779.5275;   // 96 CSS px per inch -> px per metre
let lang = (navigator.language||'en').toLowerCase().indexOf('zh')===0 ? 'zh' : 'en';
function freshState(){
  return {t0:0, secs:0, px:0, lastTop:0, lastMove:0, scrolls:0, likes:0, refreshes:0,
          jacks:0, misses:0, streak:0, bestStreak:0, badge:1,
          poolIdx:0, sinceJack:0, running:false};
}
let S = freshState();

const $ = id => document.getElementById(id);
const feed=$('feed'), toasts=$('toasts'), nav=$('nav'), start=$('start');
let tickTimer=null, toastTimer=null;

/* ===================== 3. LANGUAGE ===================== */
function applyLang(){
  const t=T[lang];
  document.documentElement.lang = (lang==='zh') ? 'zh' : 'en';
  $('s-mark').innerHTML=t.mark; $('s-sub').textContent=t.sub;
  $('open').textContent=t.open; $('s-fine').textContent=t.fine;
  $('t-home').textContent=t.tabs[0]; $('t-find').textContent=t.tabs[1];
  $('t-new').textContent=t.tabs[2];  $('t-inbox').textContent=t.tabs[3];
  $('lang').textContent = (lang==='zh') ? '中 / EN' : 'EN / 中';
  const p=$('pull'); if(p && !p.classList.contains('spin')) p.textContent=t.pull;
  if($('report').classList.contains('show')){ renderReport(); markTricksIn(); }
}
$('lang').addEventListener('click',function(){ lang = (lang==='zh')?'en':'zh'; applyLang(); });
applyLang();

/* ===================== 4. FEED ===================== */
function shuffled(){
  const a=POOL.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const s=a[i];a[i]=a[j];a[j]=s;}
  return a;
}
let pool = shuffled();
function nextItem(){
  if(S.poolIdx>=pool.length){ pool=shuffled(); S.poolIdx=0; }
  return pool[S.poolIdx++];
}

function makeCard(){
  const t=T[lang];
  S.sinceJack++;
  /* variable-ratio schedule: never in the first few, then odds creep up.
     Averages roughly one gold card every 13, so a 90s session sees a handful. */
  const jackpot = S.sinceJack>=18 ||
                  (S.sinceJack>5 && Math.random() < Math.min(0.012*S.sinceJack, 0.10));
  const miss    = !jackpot && S.sinceJack>3 && Math.random() < 0.16;

  const el=document.createElement('article');
  el.className='card'+(jackpot?' jackpot':'')+(miss?' miss':'');

  if(jackpot){
    S.jacks++; S.sinceJack=0;
    const j=JACK[Math.floor(Math.random()*JACK.length)];
    el.innerHTML=
      '<div class="head">'+
        '<div class="avatar" style="background:linear-gradient(135deg,#8A5A00,#FFC53D)">★</div>'+
        '<div class="who">loop_rare</div><div class="ago">now</div></div>'+
      '<div class="jack-tag">'+t.jack+'</div>'+
      '<div class="media">'+j[0]+'<div class="sticker">'+(lang==='zh'?j[2]:j[1])+'</div></div>'+
      '<div class="cap">'+(lang==='zh'
        ?'你运气真好。继续划还能碰到下一个。'
        :'You got lucky. Keep scrolling for the next one.')+'</div>';
  } else {
    const it=nextItem();
    if(miss) S.misses++;
    const label = miss ? (lang==='zh'?'差一点就是稀有':'ALMOST RARE')
                       : (lang==='zh'?'推荐':'FOR YOU');
    el.innerHTML=
      '<div class="head">'+
        '<div class="avatar" style="background:linear-gradient(135deg,'+it[1]+')">'+it[0]+'</div>'+
        '<div class="who">@'+it[2]+'</div>'+
        '<div class="ago">'+(Math.floor(Math.random()*58)+1)+'m</div></div>'+
      '<div class="media" style="background:linear-gradient(140deg,'+it[1]+')">'+it[0]+
        '<div class="sticker">'+label+'</div></div>'+
      '<div class="cap">'+(lang==='zh'?it[4]:it[3])+'</div>';
  }

  const bar=document.createElement('div');
  bar.className='bar';
  function act(glyph,word,isLike){
    const b=document.createElement('button');
    b.type='button'; b.className='act';
    b.innerHTML='<span class="glyph">'+glyph+'</span><span class="w">'+word+'</span>';
    if(isLike){
      b.addEventListener('click',function(){
        if(b.classList.contains('on')) return;
        b.classList.add('on','pop');
        b.querySelector('.w').textContent=T[lang].liked;
        S.likes++; bumpBadge(1);
      });
    }
    return b;
  }
  bar.appendChild(act('♥',t.like,true));
  bar.appendChild(act('↻',t.share,false));
  bar.appendChild(act('⚑',t.save,false));
  el.appendChild(bar);
  return el;
}

function addCards(n){
  const frag=document.createDocumentFragment();
  for(let i=0;i<n;i++) frag.appendChild(makeCard());
  feed.appendChild(frag);
}

function addStreak(){
  const t=T[lang];
  const el=document.createElement('div');
  el.className='streak';
  el.innerHTML='🔥 '+t.streak[0]+' <b>'+S.streak+'</b> '+t.streak[1];
  feed.appendChild(el);
}

function buildPull(){
  const b=document.createElement('button');
  b.type='button'; b.className='pull'; b.id='pull';
  b.textContent=T[lang].pull;
  b.addEventListener('click',function(){
    if(b.classList.contains('spin')) return;
    S.refreshes++;
    b.classList.add('spin'); b.textContent=T[lang].pulling;
    setTimeout(function(){
      b.classList.remove('spin'); b.textContent=T[lang].pull;
      const first=feed.querySelector('.card');
      S.sinceJack += 2;                       // refreshing raises the odds. that is the point.
      const batch=document.createDocumentFragment();
      for(let i=0;i<4;i++) batch.appendChild(makeCard());
      if(first) feed.insertBefore(batch,first); else feed.appendChild(batch);
      feed.scrollTop=0; S.lastTop=0;
      bumpBadge(1);
    },760);
  });
  return b;
}

/* ===================== 5. BADGE + TOASTS ===================== */
function bumpBadge(n){
  S.badge+=n;
  const el=$('badge');
  el.textContent = S.badge>99 ? '99+' : String(S.badge);
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}
function showToast(){
  const list=T[lang].toasts;
  const m=list[Math.floor(Math.random()*list.length)];
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML='<div class="dot"></div><div class="txt">'+m[0]+'<small>'+m[1]+'</small></div>';
  toasts.appendChild(el);
  bumpBadge(1+Math.floor(Math.random()*3));
  setTimeout(function(){ el.classList.add('out'); setTimeout(function(){el.remove();},340); },3400);
}

/* ===================== 6. RUN ===================== */
$('open').addEventListener('click',startGame);

function startGame(){
  S=freshState(); pool=shuffled();
  S.t0=performance.now(); S.running=true;
  start.hidden=true; feed.hidden=false; nav.hidden=false;
  $('report').classList.remove('show');
  $('flash').classList.remove('go');
  $('aura').style.opacity='1';
  feed.innerHTML=''; toasts.innerHTML='';
  feed.appendChild(buildPull());
  addCards(6);
  feed.scrollTop=0; S.lastTop=0;
  $('badge').textContent='1';
  clearInterval(tickTimer); clearInterval(toastTimer);
  tickTimer=setInterval(tick,250);
  toastTimer=setInterval(function(){ if(S.running && Math.random()<0.62) showToast(); },5200);
}

feed.addEventListener('scroll',function(){
  if(!S.running) return;
  const top=feed.scrollTop;
  const d=Math.abs(top-S.lastTop);
  S.px+=d; S.lastTop=top;
  if(d>34){
    /* a streak is a thing you can lose: pause for 3 seconds and it breaks */
    const now=performance.now();
    if(now-S.lastMove>3000) S.streak=0;
    S.lastMove=now;
    S.scrolls++; S.streak++;
    if(S.streak>S.bestStreak) S.bestStreak=S.streak;
    if(S.streak>0 && S.streak%12===0) addStreak();
  }
  /* infinite: top up long before the bottom, so a bottom is never seen */
  if(feed.scrollHeight - top - feed.clientHeight < 900) addCards(4);
},{passive:true});

function tick(){
  if(!S.running) return;
  if((performance.now()-S.t0)/1000 >= DURATION) cut();
}

/* ===================== 7. THE CUT ===================== */
function cut(){
  S.running=false;
  S.secs=Math.round((performance.now()-S.t0)/1000);
  clearInterval(tickTimer); clearInterval(toastTimer);
  const f=$('flash');
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  $('aura').style.opacity='0';
  setTimeout(function(){
    renderReport();
    $('report').classList.add('show');
    $('report').scrollTop=0;
    countUp(); markTricksIn();
    setTimeout(function(){ f.classList.remove('go'); },260);
  },1000);
}

function metres(){ return S.px/PX_PER_M; }

function renderReport(){
  const t=T[lang], m=metres();
  $('r-eyebrow').textContent=t.eyebrow;
  const dist = (lang==='zh')
    ? (m>=1 ? m.toFixed(1)+' 米' : (m*100).toFixed(0)+' 厘米')
    : (m>=1 ? m.toFixed(1)+' metres' : (m*100).toFixed(0)+' cm');
  $('r-verdict').innerHTML=t.verdict.replace('{d}',dist);
  $('r-lede').textContent=t.lede;

  const vals=[S.secs, S.scrolls, m.toFixed(1), S.likes, S.refreshes, 0];
  let g='';
  for(let i=0;i<t.tiles.length;i++){
    g+='<div class="tile'+(i===5?' zero':'')+'">'+
         '<div class="k">'+t.tiles[i][0]+'</div>'+
         '<div class="v"><span class="num" data-to="'+vals[i]+'" data-dec="'+(i===2?1:0)+'">0</span>'+
         (t.tiles[i][1]?'<span class="u">'+t.tiles[i][1]+'</span>':'')+'</div></div>';
  }
  $('r-grid').innerHTML=g;

  $('r-h2').textContent=t.h2;
  $('r-h2sub').textContent=t.h2sub;

  /* the marker is not a decorative 01/02/03: it is what each trick did to this player */
  const marks = (lang==='zh')
    ? ['∞','×'+S.jacks,'×'+S.misses, S.bestStreak+'连', S.badge+'点']
    : ['∞','×'+S.jacks,'×'+S.misses, S.bestStreak+' run', S.badge+' unread'];
  let tr='';
  for(let i=0;i<t.tricks.length;i++){
    tr+='<div class="trick"><div class="count">'+marks[i]+'</div><div>'+
        '<div class="lab">'+t.tricks[i][0]+'</div><h3>'+t.tricks[i][1]+'</h3>'+
        '<p>'+t.tricks[i][2]+'</p></div></div>';
  }
  $('r-tricks').innerHTML=tr;

  $('r-kicker').innerHTML = t.kick.map(function(p){return '<p>'+p+'</p>';}).join('');
  $('r-askh').textContent=t.askh;
  $('r-asklist').innerHTML = t.asks.map(function(a,i){
    return '<li><span>'+String(i+1).padStart(2,'0')+'</span>'+a+'</li>';
  }).join('');
  $('again').textContent=t.again;
  $('again2').textContent=t.again2;
  $('r-sig').innerHTML=t.sig.replace('\n','<br>');
}

function countUp(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const nums = document.querySelectorAll('#r-grid .num');
  for(let i=0;i<nums.length;i++){
    (function(el){
      const to=parseFloat(el.dataset.to), dec=+el.dataset.dec;
      if(reduce || to===0){ el.textContent=to.toFixed(dec); return; }
      const dur=900, t0=performance.now();
      function step(now){
        const p=Math.min((now-t0)/dur,1);
        el.textContent=(to*(1-Math.pow(1-p,3))).toFixed(dec);
        if(p<1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })(nums[i]);
  }
}

function markTricksIn(){
  const els=document.querySelectorAll('#r-tricks .trick');
  for(let i=0;i<els.length;i++){
    (function(el,i){ setTimeout(function(){ el.classList.add('in'); }, 320+i*150); })(els[i],i);
  }
}

$('again').addEventListener('click',function(){ $('report').classList.remove('show'); startGame(); });
$('again2').addEventListener('click',function(){
  $('report').scrollTo({top:$('r-h2').offsetTop-40,behavior:'smooth'});
});
</script>
